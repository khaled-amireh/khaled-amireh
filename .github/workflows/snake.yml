name: Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: khaled-amireh
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#3B82F6&color_dots=#E2E8F0,#BFDBFE,#60A5FA,#3B82F6,#2563EB
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#60A5FA&color_dots=#132238,#1E3A8A,#2563EB,#3B82F6,#60A5FA

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
