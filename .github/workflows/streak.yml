name: Refresh GitHub streak

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/streak.yml"
      - "scripts/update_streak.py"

permissions:
  contents: write

concurrency:
  group: github-streak-${{ github.ref }}
  cancel-in-progress: false

jobs:
  streak:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # Generate on this runner directly from GitHub, bypassing the hosted
      # service's HTTP and file caches. Never write directly over the last card.
      - name: Generate latest available streak
        uses: DenverCoder1/github-readme-streak-stats@d69abdf5492dd0bf33518fe2c66eafa0eb493d4e # v1
        env:
          DISABLE_CACHE: "true"
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          path: ${{ runner.temp }}/github-streak.svg
          options: "user=khaled-amireh&background=0B1220&border=2563EB&stroke=1E3A5F&ring=3B82F6&fire=60A5FA&currStreakLabel=60A5FA&sideLabels=CBD5E1&currStreakNum=F1F5F9&sideNums=F1F5F9&dates=94A3B8&border_radius=12&disable_animations=true&timezone=Asia%2FAmman"

      - name: Validate card and date the snapshot
        run: python3 scripts/update_streak.py "$RUNNER_TEMP/github-streak.svg"

      # A failed generation or validation stops before this step, leaving the
      # published SVG and its retrieval time untouched.
      - name: Commit valid snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-streak.svg README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh GitHub streak snapshot [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
